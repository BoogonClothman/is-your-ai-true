[project]
name = "is-your-ai-true"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BoogonClothman", email = "BoogonClothman@outlook.com" }
]
requires-python = ">=3.15"
dependencies = [
    "markdown>=3.11.3",
    "PyQt6>=6.7.0",
    "requests>=2.32.3",
]

[project.scripts]
is-your-ai-true = "is_your_ai_true:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
